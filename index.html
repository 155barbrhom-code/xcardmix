البناء الضوئي، الخزن، الإسناد، التهوية، التنفس (2) النسيج المرستيمي - الموقع: أجزاء النبات ذات النشاط الانقسامي والخلايا الحية، الوظيفة: انقسام الخلايا والنمو، استطالة قمم الجذور والسيقان، نمو البراعم، تضخم بعض الجذور والسيقان","r":0},{"id":"mwo4ow5kcs9h","q":"عدد مميزات النسيج البرنكيمي ؟ (وزاري)","a":"(1) تكون خلاياه حية رقيقة الجدران (2) غالبا ما تكون كروية الشكل أو مضلعة نتيجة الضغط الواقع عليها من الخلايا المجاورة (3) يوجد بينها مسافات بينية وهي ذات تهوية كبيرة (4) قد تحوي الخلايا بلاستيدات قد تكون خضرية وفي هذه الحالة تعرف الخلايا البرنكيمية بالخلايا الكلورنكيمية (5) تؤدي الخلايا البرنكيمية العديد من الوظائف ولعل أهمها التهوية وخزن الغذاء وتوصيله","r":2},{"id":"mwo4ow5kd3f1","q":"عرف الخلايا الكلورنكيمية؟ (وزاري متميزين)","a":"هي خلايا برنكيمية حاوية على بلاستيدات خضراء تقوم بعملية البناء الضوئي","r":0},{"id":"mwo4ow5kejxs","q":"ما موقع وأهمية (وظيفة) النسيج البرنكيمي؟ (وزاري)","a":"الموقع: في الجذور والسيقان والأوراق. الوظيفة: التهوية وخزن الغذاء وتوصيله","r":0},{"id":"mwo4ow5kfudu","q":"علل: غالبا ما تكون خلايا النسيج البرنكيمي كروية الشكل أو مضلعة (أو فسر الحقائق العلمية: خلايا النسيج البرنكيمي كروية او مسطحة)؟ (وزاري)","a":"نتيجة للضغط الواقع عليها من الخلايا المجاورة","r":0},{"id":"mwo4ow5kgbgy","q":"علل: تؤدي الخلايا البرنكيمية العديد من الوظائف، منها التهوية وخزن الغذاء؟ (التلفزيون التربوي، وزاري 2021/1-2024/1)","a":"تتم التهوية بسبب وجود المسافات البينية بين الخلايا وتقوم بالخزن لوجود فجوة عصاريه كبيرة","r":0},{"id":"mwo4ow5kh8mj","q":"ما هي مميزات النسيج الكولنكيمي؟ (وزاري متميزين)","a":"(1) خلاياه حية متطاولة (2) جدرانها متغلظة بشكل غير منتظم (3) يوجد في الأعضاء والنباتات العشبية (4) يعد من الأنسجة الدعامية الرئيسية في كثير من السيقان والأوراق وخاصة البالغة (5) يندر وجوده في جذور وأوراق نباتات ذوات الفلقة الواحدة (6) وظيفته الأساسية الدعم والتقوية يساعدها ذلك تغليظ جدران خلاياها وطريقة توزيعها في النبات","r":0},{"id":"mwo4ow5kijqq","q":"ما موقع وأهمية (وظيفة) النسيج الكولنكيمي؟ (وزاري 2026/ت)","a":"الموقع: في الأعضاء والنباتات العشبية وكذلك الأعضاء البالغة للنباتات العشبية. الوظيفة: تمثل الوظيفة الرئيسية للنسيج الكولنكيمي بالدعم والتقوية","r":0},{"id":"mwo4ow5kj26z","q":"علل: تمثل الوظيفة الرئيسية للنسيج الكولنكيمي بالدعم والتقوية؟ (وزاري)","a":"يساعدها في ذلك تغليظ جدران خلاياها وطريقة توزيعها في النبات","r":0},{"id":"mwo4ow5kkims","q":"علل: وجود النسيج الكولنكيمي في النباتات العشبية؟ (وزاري)","a":"لأنها تقوم بعملية الدعم والإسناد للسيقان الغضة","r":0},{"id":"mwo4ow5kl50o","q":"علل: قوة وصلابة السيقان العشبية ؟ (وزاري)","a":"لاحتوائها على النسيج الكولنكيمي","r":0},{"id":"mwo4ow5kmbms","q":"ما نوع النسيج في الأعضاء البالغة للنباتات العشبية ؟ (وزاري متميزين)","a":"نسيج كولنكيمي","r":0},{"id":"mwo4ow5knsam","q":"ما موقع وأهمية (وظيفة) النسيج السكلرنكيمي؟ (وزاري)","a":"الموقع: أجزاء النباتات التي تحتاج إلى تقوية، كما يوجد في بعض الثمار مثل الكمثرى. الوظيفة: تتلخص وظيفته بالدعم والتقوية","r":0},{"id":"mwo4ow5ko8lg","q":"اكمل الفراغ: يشمل النسيج السكلرنكيمي نوعين من الخلايا هما .......... و .......... (أو يوجد نوعان من الخلايا السكلرنكيمية .......... و ..........) (وزاري 2025/3)","a":"الألياف ، الخلايا الصخرية (الحجرية)","r":0},{"id":"mwo4ow5kphfd","q":"اذكر مميزات الألياف النباتية (أو وضح طبيعة الالياف النباتية / ما ميزة الالياف النباتية)؟ (وزاري 1988/1، 2018/1، 2020/1)","a":"(1) تكون طويلة ومدببة النهايات (2) توجد منفردة أو بشكل حزم في أجزاء النبات التي تحتاج إلى تقوية","r":0},{"id":"mwo4ow5kqyuu","q":"علل: تكسب الالياف النباتية الاجزاء الموجودة فيها قوة ومتانة ؟ (وزاري 2007/1)","a":"(1) لانها تكون طويلة ومدببة النهايات (2) توجد منفردة أو بشكل حزم في أجزاء النبات التي تحتاج إلى تقوية","r":0},{"id":"mwo4ow5krxl9","q":"قارن بين الالياف والخلايا الصخرية ؟ (وزاري)","a":"(1) الالياف: تكون طويلة ومدببة النهايات وتوجد بشكل حزم او منفردة، اما الخلايا الصخرية: تكون قصيرة (2) الالياف: توجد في أجزاء النباتات التي تحتاج الى دعم وتقوية، اما الخلايا الصخرية: توجد في بعض الثمار مثل الكمثرى","r":0},{"id":"mwo4ow5kssdk","q":"ما موقع كل مما يأتي: الخلايا الصخرية أو الحجرية؟ (وزاري)","a":"في بعض الثمار مثل الكمثرى","r":0},{"id":"mwo4ow5kts4k","q":"علل: تمتاز ثمار الكمثرى بصلابتها؟ (وزاري)","a":"لانها تتكون من خلايا صخرية (حجرية) تعطي صلابة للكمثرى وهي من النسيج السكلرنكيمي","r":0},{"id":"mwo4ow5kun73","q":"ما نوع (طبيعة) النسيج في كل مما يأتي: (1) الكمثرى (2) الخلايا الصخرية (وزاري)","a":"(1) نسيج سكلرنكيمي او خلايا صخرية (2) نسيج سكلرنكيمي","r":0},{"id":"mwo4ow5kvzjv","q":"عرف الخلايا الصخرية ؟ (وزاري متميزين، 2026/ت)","a":"وهي إحدى خلايا النسيج السكلرنكيمي تكون الخلايا قصيرة توجد في بعض الثمار مثل الكمثرى","r":0},{"id":"mwo4ow5kwonr","q":"ما نوع النسيج في الالياف؟","a":"النسيج السكلرنكيمي","r":0},{"id":"mwo4ow5kxz5m","q":"قارن بين النسيج البرنكيمي والنسيج الكولنكيمي والنسيج السكلرنكيمي (أو كيف تميز بين النسيج البرنكيمي والنسيج الكولنكيمي)؟ (مكرر 4 مرات)","a":"(1) الخلايا: النسيج البرنكيمي حية رقيقة الجدران، النسيج الكولنكيمي خلاياه حية جدرانها متغلظة بشكل غير منتظم، النسيج السكلرنكيمي خلاياه ميتة جدرانها متغلظة لغرض الإسناد أو التلكنين (2) الشكل: النسيج البرنكيمي كروية الشكل أو مضلعة، النسيج الكولنكيمي خلاياه متطاولة الشكل، النسيج السكلرنكيمي خلاياه تختلف في الشكل فمنها طويلة ومدببة النهايات ومنها قصيرة (3) المسافات البينية: النسيج البرنكيمي توجد مسافات بينية، النسيج الكولنكيمي لا توجد مسافات بينية، النسيج السكلرنكيمي لا توجد مسافات بينية (4) الوظيفة: النسيج البرنكيمي التهوية وخزن الغذاء وتوصيله، النسيج الكولنكيمي الدعم والتقوية، النسيج السكلرنكيمي الدعم والتقوية (5) البلاستيدات الخضرية: النسيج البرنكيمي قد يحتوي على بلاستيدات خضر ويسمى بالخلايا الكلورنكيمية، النسيج الكولنكيمي لا يحتوي على بلاستيدات الخضر، النسيج السكلرنكيمي لا يحتوي على بلاستيدات (6) الموقع: النسيج البرنكيمي يوجد في الجذور والسيقان والأوراق ضمن القشرة واللب والأشعة اللبية، النسيج الكولنكيمي يوجد في الأعضاء البالغة في النباتات وفي الأعضاء العشبية، النسيج السكلرنكيمي يوجد في أجزاء النباتات التي تحتاج إلى تقوية كما يوجد في بعض الثمار مثل الكمثرى","r":0}]}]}]},{"id":"mwmwg7eb1kl3","n":"الكيمياء","e":"⚗️","c":"#7f26d9","ch":[{"id":"mwp87cfe6o0x","n":"الفصل الثاني","lec":[{"id":"mwp8cgw2g58n","n":"محاضرة  2٫1","cards":[{"id":"mwp8ck8khzi7","q":"عرف التفاعل الكيميائي؟","a":"وهو عملية تتحول فيها مادة واحدة او اكثر الى مواد جديدة تختلف في صفاتها عن المادة او المواد التي تفاعلت في البداية","r":0},{"id":"mwp8ck8ki745","q":"عرف المعادلة الكيميائية؟","a":"هي اختصار علمي يمثل التحول الحاصل في المواد المتفاعلة للحصول على النواتج ويمثل السهم في المعادلة اتجاه التفاعل","r":0},{"id":"mwp8ck8kjg7f","q":"ما هي أقسام التفاعلات حسب اتجاه التفاعل؟","a":"تنقسم الى قسمين: (1) تفاعلات غير انعكاسية تامة (→): وهي التفاعلات الكيميائية التي يتم فيها استهلاك كامل لأحد او جميع المواد المتفاعلة ولا يكون للمواد الناتجة عند نفس الظروف القدرة على ان تتفاعل لتكوين المواد التي تكونت منها وتمثل بسهم واحد مثل A + B → 2C (2) تفاعلات انعكاسية غير تامة (⇌): وهي التفاعلات الكيميائية التي يتم فيها تحول المادة المتفاعلة الى نواتج في بداية التفاعل ويكون للمواد الناتجة المقدرة على ان تتفاعل مع بعضها لتكوين المواد التي تكونت منها مرة اخرى وتمثل بسهمين متعاكسين مثل A + B ⇌ AB","r":0},{"id":"mwp8ck8kky5k","q":"عرف حالة الإتزان (الإتزان الكيميائي)؟","a":"وهي حالة يصل اليها التفاعل عندما تتساوى سرعتي التفاعل الامامي والخلفي فيصل التفاعل الى حالة تدعى حالة الإتزان وهي حالة اتزان ديناميكي حركي وليس اتزان استاتيكي ساكن","r":2},{"id":"mwp8ck8klw7w","q":"ما هي أقسام التفاعلات الانعكاسية حسب الطور الفيزيائي؟","a":"تنقسم الى قسمين: (1) التفاعلات الانعكاسية المتجانسة: وهي التفاعلات التي تكون فيها المواد المتفاعلة والناتجة جميعها في طور واحد مثل Zn(s) + S(s) ⇌ ZnS(s) و N2O4(g) ⇌ 2NO2(g) (2) التفاعلات الانعكاسية غير المتجانسة: وهي التفاعلات التي توجد فيها المواد المتفاعلة والناتجة في اكثر من طور واحد مثل H2O(l) ⇌ H2O(g) و 2Hg(l) + O2(g) ⇌ 2HgO(s)","r":2},{"id":"mwp8ck8kmmn5","q":"علل: تتوقف بعض التفاعلات تماما بينما تظهر تفاعلات اخرى وكانها متوقفة ؟ (وزاري)","a":"ان التفاعلات التي تتوقف هي التفاعلات الغير انعكاسية (التامة) حيث يتم استهلاك احد او جميع المواد المتفاعلة تماما فتتوقف اما التفاعلات الانعكاسية والتي تظهر وكانها متوقفة ولكنها في الحقيقة لا تزال مستمرة وتجري في كلا الاتجاهين لان حالة الإتزان الكيميائي هي حالة اتزان ديناميكي حركي وليس استاتيكي ساكن اي ان التفاعل مستمر وفي كلا الاتجاهين الامامي والخلفي بالمقدار والسرعة ذاتها اي ان سرعة التفاعل الامامي = سرعة التفاعل الخلفي فيبقى التفاعل في حالة اتزان","r":0},{"id":"mwp8ck8knd5g","q":"عرف قانون فعل الكتلة؟ (وزاري مهم مكرر)","a":"عند ثبوت درجة الحرارة فان سرعة التفاعل الكيميائي تتناسب طرديا مع التراكيز المولارية للمواد المتفاعلة كلا منهما مرفوع الى اس يمثل عدد المولات الموضوعة امام كل مادة في المعادلة الكيميائية الموزونة","r":0},{"id":"mwp8ck8ko4ni","q":"عرف ثابت الإتزان Keq وما هو قانونه؟","a":"وهو النسبة بين ثابت سرعة التفاعل الامامي Kf وثابت سرعة التفاعل الخلفي Kb، ويعطى بالقانون Keq = Kf / Kb (ثابت سرعة التفاعل الامامي على ثابت سرعة التفاعل الخلفي)","r":0},{"id":"mwp8ck8kp077","q":"ما هي أقسام ثابت الإتزان Keq؟","a":"يقسم الى قسمين: (1) ثابت الإتزان بدلالة التراكيز المولارية Kc (2) ثابت الإتزان بدلالة الضغوط الجزيئية Kp","r":2},{"id":"mwp8ck8kq749","q":"عرف ثابت الإتزان بدلالة التراكيز المولارية Kc وما هي الأطوار التي تدخل في علاقته؟","a":"هو حاصل ضرب التراكيز المولارية للمواد الناتجة عند حالة الإتزان مقسوما على حاصل ضرب التراكيز المولارية للمواد المتفاعلة عند حالة الإتزان كل منها مرفوع الى اس يمثل عدد مولاتها في معادلة التفاعل الموزونة، ويشمل الغازات (g) والمحاليل المائية (aq) وتحذف الصلبة (s) والسائلة (l) لان تراكيزها = 1M","r":2},{"id":"mwp8ck8krmvw","q":"عرف ثابت الإتزان بدلالة الضغوط الجزيئية Kp وما هي الأطوار التي تدخل في علاقته؟","a":"هو حاصل ضرب الضغوط الجزيئية للمواد الناتجة عند الإتزان مقسوما على حاصل ضرب الضغوط الجزيئية للمواد المتفاعلة عند الإتزان كل منها مرفوع الى اس يمثل عدد مولاتها في معادلة التفاعل الموزونة، ويشمل الغازات (g) فقط وتحذف الصلبة (s) والسائلة (l) والمحاليل المائية (aq)","r":2},{"id":"mwp8ck8ksy34","q":"علل: تحذف تراكيز المواد الصلبة والسائلة النقية من علاقة ثابت الإتزان ؟","a":"لان المواد السائلة والصلبة النقية يبقى تركيزها ثابت مهما تغيرت كميتها حتى وان تغير الحجم فان النسبة بين كمية هذه المواد الى الحجم سوف تبقى ثابتة","r":0}]}]}]},{"id":"mwmwg7ec2grz","n":"الفيزياء","e":"⚛️","c":"#267fd9","ch":[{"id":"mwmwk1ti8yu2","n":"الفصل الثاني","lec":[{"id":"mwmwt7f1k2um","n":"محاضرة 1","cards":[{"id":"mwmwtsx1nv0t","q":"ما الذي يحصل عند حركة جسيم مشحون بشحنة موجبة (q) يتحرك باتجاه عمودي على خطوط مجال كهربائي (E) منتظم ؟","a":"يتأثر الجسيم بقوة كهربائية (FE) ويتحرك بمستوى مواز لخطوط المجال الكهربائي، وتعطى القوة الكهربائية بالعلاقة : (FE = q * E) وتقاس بوحدة N نيوتن، حيث q : مقدار الشحنة ويقاس بوحدة الكولوم C، و E : مقدار المجال الكهربائي ويقاس بوحدة N/C","r":0},{"id":"mwmwtsx4qqho","q":"علام يعتمد مقدار القوة المغناطيسية المؤثرة في الجسيم المشحون المتحرك عموديا داخل مجال مغناطيسي منتظم ؟","a":"(1) مقدار سرعة الجسيم v (2) مقدار كثافة الفيض المغناطيسي B (3) مقدار الشحنة q (4) جيب الزاوية sin θ","r":2},{"id":"mwmwtsx4tat8","q":"كيف يتم تحديد اتجاه القوة المغناطيسية المؤثرة في جسيم مشحون يتحرك داخل مجال مغناطيسي؟","a":"لتعيين اتجاه القوة المغناطيسية (FB) نطبق قاعدة الكف اليمنى، حيث تدور اصابع الكف اليمنى من اتجاه السرعة (v) نحو اتجاه المجال المغناطيسي (B) فيشير الابهام الى اتجاه القوة المغناطيسية (FB)","r":1},{"id":"mwmwtsx1m7il","q":"ما هي طرق توليد المجال المغناطيسي؟","a":"(1) حول الشحنات الكهربائية المتحركة (2) حول المغانط الدائمة","r":2},{"id":"mwmwtsx0l23d","q":"ما هي استخدامات المغناطيس الكهربائي؟","a":"(1) رفع قطع الحديد الثقيلة (2) في معظم الاجهزة الكهربائية (3) وفي تسيير القطارات فائقة السرعة","r":2},{"id":"mwmwtsx4u71j","q":"ما المقصود بقوة لورنز ؟ وأين تستثمر ؟","a":"قوة لورنز : هي محصلة قوتين احداهما قوة مغناطيسية (FB) والأخرى قوة كهربائية (FE) تؤثر في جسيم موجب الشحنة عندما يتحرك داخل مجالين متعامدين كهربائي ومغناطيسي في ان واحد ويكون اتجاه القوة المغناطيسية (FB) اما باتجاه القوة الكهربائية (FE) او باتجاه معاكس لها، وتستثمر للتحكم في مسار الحزمة الالكترونية الساقطة على الشاشة كما هو الحال في انبوبة الاشعة الكاثودية","r":0},{"id":"mwmwtsx1ogt0","q":"علام يعتمد مقدار القوة الكهربائية المؤثرة في جسيم مشحون يتحرك عموديا داخل مجال كهربائي منتظم ؟","a":"(1) مقدار الشحنة q (2) المجال الكهربائي E","r":2},{"id":"mwmwtsx4r14r","q":"متى تكون القوة المغناطيسية بأعظم مقدار ومتى بأقل مقدار ؟","a":"تكون بأعظم مقدار عندما يتحرك الجسيم المشحون باتجاه عمودي على خطوط المجال المغناطيسي (الزاوية θ = 90° حيث sin 90° = 1)، وتكون بأقل مقدار (تساوي صفرا) عندما يتحرك الجسيم المشحون باتجاه مواز لخطوط المجال المغناطيسي (الزاوية θ = 0° أو 180° حيث sin 0° = 0)","r":0},{"id":"mwmwtsx4sf0i","q":"وضح كيف يمكنك عمليا معرفة فيما اذا كان مجالا مغناطيسيا ام مجالا كهربائيا موجودا في حيز معين؟ (وزاري)","a":"يتم ذلك بقذف جسيم مشحون داخل المجال، فاذا انحرف الجسيم بموازاة المجال فأن المجال الموجود في الحيز هو مجال كهربائي اما اذا انحرف الجسيم المشحون باتجاه عمودي على المجال فإن المجال الموجود هو مجال مغناطيسي، اما اذا لم ينحرف الجسيم المشحون فإن المجال الموجود هو مجال مغناطيسي","r":0},{"id":"mwmwtsx1pwqi","q":"ما الذي يحصل عند حركة جسيم مشحون بشحنة موجبة (q) يتحرك باتجاه عمودي على خطوط مجال مغناطيسي منتظم ؟","a":"يتأثر الجسيم بقوة مغناطيسية (FB) بمستوى عمودي على ذلك الفيض المغناطيسي وسينحرف الجسيم عن مساره الاصلي ويتخذ مسارا دائريا، وتعطى القوة المغناطيسية بالعلاقة : (FB = q * v * B) حيث ان : q : مقدار الشحنة وتقاس بالكولوم C، و v : مقدار سرعة الجسيم وتقاس بوحدة m/s، و B : كثافة الفيض المغناطيسي وتقاس بوحدة تسلا T","r":0}]},{"id":"mwnlld366w4s","n":"محاضرة 3","cards":[{"id":"mwnllyxm72pf","q":"ما هو المقصود بالقوة الدافعة الكهربائية الحركية؟","a":"هي القوة الدافعة الكهربائية المتولدة بوساطة تحريك ساق موصلة داخل مجال مغناطيسي منتظم وهي حالة خاصة من حالات الحث الكهرومغناطيسي، وتعطى بالعلاقة Emotinal = BLV sinθ","r":0},{"id":"mwnllyxm84ei","q":"علام يعتمد مقدار فرق الجهد الكهربائي (القوة الدافعة الكهربائية الحركية) بين طرفي ساق تتحرك عموديا على مجال مغناطيسي ؟ (وزاري)","a":"حسب العلاقة (Emotinal = BLV sinθ) يعتمد على: (1) مقدار كثافة الفيض المغناطيسي B (2) مقدار سرعة الساق داخل المجال المغناطيسي v (3) طول الساق الذي يتحرك داخل المجال المغناطيسي L (4) جيب الزاوية sinθ (الزاوية المحصورة بين متجه السرعة ومتجه كثافة الفيض)","r":0},{"id":"mwnllyxm9ikf","q":"وضح كيف تتولد القوة الدافعة الكهربائية الحركية ثم اشتق القانون؟","a":"(1) ان حركة الساق الموصلة داخل مجال مغناطيسي منتظم تتأثر الشحنات الموجبة للساق بقوة مغناطيسية (2) هذه القوة المغناطيسية (FB1) تفصل الشحنات الموجبة عن الشحنات السالبة اذ تتجمع الشحنات الموجبة عند طرفها العلوي والشحنات السالبة عند طرفها السفلي (3) يتولد فرق جهد كهربائي بين طرفي الساق يسمى قوة دافعة كهربائية محتثة حركية (Emotinal) (4) ينشأ لذلك مجال كهربائي (E) يتجه نحو الاسفل والمجال الكهربائي المتولد سيؤثر بدوره بقوة على هذه الشحنات تتجه معاكسة للقوة المغناطيسية (5) عندما يتساوى مقداري القوة المغناطيسية والقوة الكهربائية (FB = FE) يحصل حالة الاتزان (qvB = qE). الاشتقاق: FB1 = FE ومنها qvB = qE اذن E = vB ، وبما ان E = ΔV / L فان vB = ΔV / L ومنها ΔV (Emotinal) = B L V sinθ","r":0},{"id":"mwnllyxma5al","q":"ما الذي يعمل على فصل الشحنات الموجبة عن الشحنات السالبة داخل الساق الموصلة المتحركة داخل مجال مغناطيسي منتظم ؟","a":"القوة المغناطيسية FB = qvb ويعين اتجاه القوة المغناطيسية على وفق قاعدة الكف اليمنى","r":2},{"id":"mwnllyxnbwuv","q":"ما سبب نشوء (تولد) مجال كهربائي (E) داخل الساق الموصلة عندما تتحرك داخل مجال مغناطيسي منتظم باتجاه عمودي على خطوطه ؟","a":"بسبب تولد قوة مغناطيسية FB = qvB تؤثر في الشحنات الموجبة والتي تعمل على فصل الشحنات الموجبة عن الشحنات السالبة فتتجمع الشحنات الموجبة عند احد طرفي الساق والشحنات السالبة عند طرفه الاخر، فيتولد فرق جهد كهربائي (ΔV)","r":2},{"id":"mwnllyxnczfn","q":"علام يعتمد اتجاه القطبية للقوة الدافعة الكهربائية المحتثة الحركية؟ (ملاحظة)","a":"تعتمد على اتجاه سرعة حركة الموصل أو على اتجاه المجال المغناطيسي","r":0},{"id":"mwnllyxnd0o8","q":"حدد اتجاه التيار واذكر اسم القاعدة المستخدمة لذلك ؟","a":"القاعدة المستخدمة هي قاعدة الكف اليمنى: عندما تكون حركة الساق نحو اليسار عموديا على الفيض المغناطيسي فان القوة المغناطيسية تؤثر في الشحنات الموجبة ويكون اتجاهها نحو الطرف (a) على وفق قاعدة الكف اليمنى، فتتجمع الشحنات الموجبة في الطرف (a) للساق والسالبة في الطرف (b) لذا يكون اتجاه المجال الكهربائي (E) من (a) نحو الطرف (b). وبانعكاس اتجاه حركة الساق (نحو اليمين) ينعكس اتجاه (FB) لذلك تتجمع الشحنات الموجبة في الطرف (b) والشحنات السالبة في طرفها (a) لذا يكون اتجاه (E) من (b) نحو (a)","r":1}]},{"id":"mwnmp4fterk5","n":"محاضرة 4","cards":[{"id":"mwnmph1jfut9","q":"كيف ينساب تيار محتث داخل ساق موصلة في مجال مغناطيسي منتظم؟","a":"(1) إغلاق الدائرة بالسكة (شكل U): نضع الساق الموصلة داخل دائرة كهربائية مقفلة، حيث تنزلق الساق بسرعة (v) نحو اليمين على سكة موصلة بشكل حرف U، ومربوط معها مصباح كهربائي على التوالي (2) تسليط المجال المغناطيسي: نسلط مجالا مغناطيسيا منتظما كثافة فيضه (B) بشكل عمودي على مستوى الدائرة والسكة (3) تأثير القوة المغناطيسية وفصل الشحنات: تتأثر الشحنات الموجبة داخل الساق بقوة مغناطيسية (FB) تفصلها وتدفعها نحو أحد طرفي الساق، بينما تندفع الشحنات السالبة نحو الطرف الآخر (4) استمرار حركة الشحنات (الفرق عن المحاضرة الثالثة): لأن الدائرة مقفلة بالسكة الموصلة، لا تتوقف الشحنات عند طرفي الساق، بل تستمر بالحركة والدوران عبر السكة الموصلة (5) انسياب التيار المحتث وتوهج المصباح: نتيجة لاستمرار حركة الشحنات في الدائرة المقفلة، ينساب تيار محتث (Iind)، والدليل العملي على انسيابه هو توهج المصباح الكهربائي المربوط في الدائرة (6) القانون الرياضي للتيار المحتث: يحسب مقدار التيار المحتث بقسمة القوة الدافعة الكهربائية الحركية على المقاومة الكلية للدائرة Iind = Emot / R = (B * l * v) / R","r":0},{"id":"mwnmph1jgnne","q":"1- ما منشأ القوة الدافعة المعرقلة لحركة الساق داخل مجال مغناطيسي؟ 2- كيف يمكن جعل هذه الساق تتحرك بسرعة ثابتة بالرغم من وجود هذه القوة المعرقلة ؟","a":"(1) بسبب انسياب تيار محتث في الساق باتجاه عمودي على الفيض المغناطيسي تظهر قوة مغناطيسية تؤثر في هذا الساق تعطى بالعلاقة (FB2 = ILB) وبتطبيق قاعدة الكف اليمنى نجد ان القوة (FB2) ستؤثر باتجاه عمودي على الساق وتكون معاكسة لاتجاه السرعة (v) التي تتحرك بها الساق، فهي تتجه نحو اليسار، لذا فإن هذه القوة تعمل على عرقلة حركة الساق، فتسبب في تباطؤ حركة الساق (2) يمكن جعلها تتحرك بسرعة ثابتة بتسليط قوة خارجية (قوة ساحبة Fpull) تساوي في المقدار القوة المغناطيسية المعرقلة (FB2) وتعاكسها بالاتجاه وتعطى بالعلاقة Fpull = ILB = (B^2 * L^2 * v) / R","r":0},{"id":"mwnmph1jh3dk","q":"علل: يتطلب تسليط قوة خارجية (قوة ساحبة Fpull) لكي نجعل الساق الموصلة تتحرك بسرعة ثابتة باتجاه عمودي على مجال مغناطيسي منتظم ؟","a":"بسبب ظهور قوة مغناطيسية (FB2 = ILB) تؤثر في الساق نتيجة لانسياب التيار فيها وتؤثر هذه القوة باتجاه معاكس لحركة الساق فتعمل على عرقلة حركة الساق، ولهذا السبب يتطلب تسليط قوة ساحبة كي تتحرك الساق بسرعة ثابتة وتعطى بالعلاقة Fpull = ILB = (B^2 * L^2 * v) / R","r":0},{"id":"mwnmph1jislh","q":"عند تحريك ساق موصلة داخل مجال مغناطيسي هل يعني ذلك انجاز شغل ؟ وما مصير الطاقة المتنقلة في الساق الموصلة ؟","a":"عند تحريك الساق يعني انجاز شغل وتحول هذا الشغل الى (Emotinal) على طرفي الساق ويمكن ان تتحول الطاقة الى شغل ميكانيكي او حراري في الساق","r":0},{"id":"mwnmph1jj9d8","q":"ما المقصود بالقدرة وما علاقتها الرياضية؟","a":"القدرة هي المعدل الزمني للشغل المنجز، وتعطى بالعلاقة power = work / time","r":0},{"id":"mwnmph1jkqt2","q":"هل يعد الحث الكهرومغناطيسي مبدأ لقانون حفظ الطاقة ؟ (وزاري)","a":"نعم لان المعدل الزمني للشغل المنجز في تحريك الساق الموصلة خلال مجال مغناطيسي يساوي بالضبط المعدل الزمني للطاقة المتبددة في المقاومة الكلية لهذه الدائرة ويعد هذا تطبيقا لقانون حفظ الطاقة","r":0}]}]}]},{"id":"mwmwg7ec34pp","n":"اللغة العربية","e":"📖","c":"#d92644","ch":[{"id":"mwpinur26s5f","n":"الجزء الاول","lec":[{"id":"mwpio7fw7y0n","n":"الجواهري الجزء 1","cards":[{"id":"mwpiobpm8hj5","q":"من هو الجواهري ؟ تحدث عن سيرة حياته.","a":"هو محمد مهدي ابن الشيخ عبد الحسين الجواهري. ولد في مدينة النجف الأشرف عام 1899م وتوفي في دمشق عام 1997م ودفن فيها","r":0},{"id":"mwpiobpm9qjz","q":"من أي الأسر كان الجواهري ؟ وبم اشتهرت اسرته ؟","a":"الجواهري من أسرة عريقة اشتهرت بالزعامة الدينية من عهد مؤسسها الشيخ محمد حسن صاحب كتاب (جواهر الكلام في شرح شرائع السلام)","r":0},{"id":"mwpiobpmaicx","q":"ماذا توحي لك لفظة ( جواهر الكلام في شرح شرائع السلام )؟ (مرشح وزاري)","a":"جواهر الكلام : وهو كتاب فقهي ألفه مؤسس عائلة الجواهري الشيخ (محمد حسن)","r":0},{"id":"mwpiobpmbar9","q":"ماذا درس الجواهري ؟","a":"وهو في سن السابعة درس في الكتاتيب في النجف الاشرف اتجه بعد ذلك كما يتجه كل أفراد أسرته منذ حداثته لدراسة علوم اللغة والمنطق والفقه وأصوله","r":0},{"id":"mwpiobpmcozw","q":"ما الذي أثر في تكوين شخصية الجواهري الأدبية ونضجه الفني؟ (وزاري 2024 د1 علمي)","a":"كان للإرث الثقافي وتلك البيئة وعشقه للشعر وتعلقه بالشعراء أثر كبير في تكوين شخصيته الأدبية ونضجه الفني وارتقائه القمة حتى لقب بـ (شاعر العرب الأكبر) من دون منازع، وكذلك لقب بـ (نهر العراق الثالث)","r":0},{"id":"mwpiobpmda5i","q":"ما أثر البيئة في توجه الجواهري للشعر؟ (وزاري 2023 د1)","a":"كان لبيئة النجف التي كانت تزدحم بالمجالس العلمية والأدبية، درس وهو في سن السابعة درس في الكتاتيب في النجف الاشرف اتجه بعد ذلك كما يتجه كل أفراد أسرته منذ حداثته لدراسة علوم اللغة والمنطق والفقه وأصوله","r":0},{"id":"mwpiobpme4bb","q":"تحدث عن بيت الجواهري ؟ وماذا قرأ الجواهري ؟ وماذا حفظ ؟ أو كيف ثقف الجواهري نفسه؟","a":"كان بيت الجواهري بيت علم وشعر وأدب، شأنه كشأن بيوت كثيرة في النجف آنذاك. فقرأ لكبار الشعراء وحفظ شعرهم وتأثر بهم منذ حداثته. وقيل إنه حفظ ديوان المتنبي كله، وقسما كبيرا من شعر غيره من مشاهير الشعراء القدماء، والتقى أحب الشعراء إلى قلبه الشاعر محمد سعيد الحبوبي في بيت أسرته","r":0},{"id":"mwpiobpmf6sy","q":"بم لقب الجواهري؟ (وزاري 2020 د1 أدبي)","a":"لقب بـ (شاعر العرب الأكبر) من دون منازع، وكذلك لقب بـ (نهر العراق الثالث)","r":0},{"id":"mwpiobpmgyih","q":"لماذا لقب الجواهري بـ (شاعر العرب الأكبر) و(نهر العراق الثالث) ؟ (وزاري 2020 د1 أدبي)","a":"وذلك لما كان للإرث الثقافي وتلك البيئة وعشقه للشعر وتعلقه بالشعراء أثر كبير في تكوين شخصيته الأدبية ونضجه الفني وارتقائه القمة","r":0},{"id":"mwpiobpnhpax","q":"كيف يرى النقاد الجواهري ؟ أو ما مكانة الجواهري الأدبية بين النقاد؟ (وزاري مكرر)","a":"يرى النقاد أن الجواهري أكبر شاعر صور حياة العراق السياسية المضطربة في شعره منذ حقبة العشرينيات من القرن الماضي","r":0},{"id":"mwpiobpni9ev","q":"ما أهم ما يميز شعر الجواهري؟ (وزاري مكرر، مرشح وزاري)","a":"(1) تميز شعره بالجد في الموقف (2) الانسياب العاطفي القوي، فالتدفق العاطفي في شعره يعطيه قوة ايقاعية ذات توتر يناسب نوع الاندفاعات الغاضبة التي تميز شعره (3) لغته الشعرية غنية يختارها بعناية، فهو يمتلك ثراء لغويا يصعب الإلمام بمصادره جميعها مما أتاح له مجال الاختيار المناسب للمفردة وتوظيفها بعفوية في النص من غير تكلف أو إقحام","r":1},{"id":"mwpiobpnjjak","q":"ما أهمية التدفق العاطفي في شعر الجواهري ؟","a":"يعطيه قوة ايقاعية ذات توتر يناسب نوع الاندفاعات الغاضبة التي تميز شعره","r":0},{"id":"mwpiobpnk531","q":"علل: للثراء اللغوي الذي يتمتع به الجواهري أثر بالغ في قصائده؟","a":"أتاح له الثراء اللغوي مجال الاختيار المناسب للمفردة وتوظيفها بعفوية في النص من غير تكلف أو إقحام","r":0},{"id":"mwpiobpnlxwh","q":"من أحب الشعراء إلى قلب الجواهري ؟","a":"أحب شاعر إلى قلب الجواهري هو محمد سعيد الحبوبي","r":0},{"id":"mwpiobpnml8b","q":"كيف كانت اللغة الشعرية لدى الجواهري؟","a":"ولغته الشعرية غنية يختارها بعناية، فهو يمتلك ثراء لغويا يصعب الإلمام بمصادره جميعها مما أتاح له مجال الاختيار المناسب للمفردة وتوظيفها بعفوية في النص من غير تكلف أو إقحام","r":0},{"id":"mwpiobpnnhkb","q":"ما مناسبة قصيدة (آمنت بالحسين) للجواهري ؟ ومتى القاها ؟ (وزاري مكرر)","a":"ألقاها عام (1947م) في ذكرى استشهاد الإمام الحسين (عليه السلام)","r":0},{"id":"mwpiobpnoift","q":"ما معنى كلمة: الأبلج؟","a":"وضاء الوجه","r":0},{"id":"mwpiobpnphic","q":"ما معنى كلمة: الأروع؟","a":"المعجب بشجاعته وحسنه","r":0},{"id":"mwpiobpnq38n","q":"ما معنى كلمة: الروح؟","a":"هنا نسيم الريح","r":0},{"id":"mwpiobpnr7e7","q":"ما معنى كلمة: أضوع؟","a":"من ضاع المسك يضوع إذا عبقت رائحته وانتشرت","r":0},{"id":"mwpiobpnsnnk","q":"ما معنى كلمة: المهيع؟","a":"البين الواضح","r":0},{"id":"mwpiobpntdeu","q":"ما معنى كلمة: يذال؟","a":"يهان","r":0}]}]}]},{"id":"mwmwg7ec4q1x","n":"اللغة الإنكليزية","e":"🔤","c":"#26bbd9","ch":[{"id":"mwo8expm6zzk","n":"كلمات اليونت 2","lec":[{"id":"mwo8f5tb73gg","n":"الاجرام","cards":[{"id":"mwo8fa8p8gmr","q":"اثار القدم","a":"Footprint | Example: They found footprints and fingerprints they think were left by the criminal.","r":0},{"id":"mwo8fa8p9mqy","q":"بصمة الابهام","a":"Fingerprint | Example: They found footprints and fingerprints they think were left by the criminal.","r":1},{"id":"mwo8fa8pa52m","q":"جهاز كشف السرعة","a":"radar speed gun | Example: Police officers use a radar speed gun to catch drivers who drive too fast.","r":0},{"id":"mwo8fa8pbk25","q":"كشاف المواد المعدنية","a":"Metal detector | Example: You have to walk through a metal detector at the airport security.","r":0},{"id":"mwo8fa8pc2oy","q":"حارس امني","a":"security guard | Example: A security guard watches the entrance of the bank all night.","r":0},{"id":"mwo8fa8pdw7n","q":"كاميرات مراقبة","a":"Security camera | Example: The security camera recorded the thief entering the shop.","r":0},{"id":"mwo8fa8pesti","q":"مشهد الجريمة","a":"Crime scene | Example: The police got a call about a robbery last night, and when they got to the crime scene they looked for clues.","r":0},{"id":"mwo8fa8pfetf","q":"حد السرعة","a":"Speed limit | Example: Drivers must not drive faster than the speed limit.","r":0},{"id":"mwo8fa8pg951","q":"تذكرة مخالفة السرعة","a":"Speeding ticket | Example: He got a speeding ticket because he was driving too fast.","r":0},{"id":"mwo8fa8phvvn","q":"جهاز اشعة","a":"x-ray machine | Example: Airport security puts your bags through an x-ray machine to check them.","r":0},{"id":"mwo8fa8pi7f5","q":"حزام الأمان","a":"seat belt | Example: You must always wear your seat belt when you are in a car.","r":0},{"id":"mwo8fa8pjkme","q":"يرتكب","a":"Commit | Example: If you commit a crime, the police will arrest you.","r":1},{"id":"mwo8fa8pk5og","q":"صفارة الشرطة","a":"Siren | Example: We heard the loud police siren coming down the street.","r":1},{"id":"mwo8fa8pllul","q":"يشبه","a":"look like | Example: Can you describe what the thief look like?","r":0},{"id":"mwo8fa8pmnpb","q":"خبراء","a":"Experts | Example: Police experts examined the fingerprints found at the crime scene.","r":0},{"id":"mwo8fa8pnvt3","q":"دليل","a":"Evidence | Example: The police are looking for evidence to solve the crime.","r":1},{"id":"mwo8fa8povxk","q":"يجذب","a":"Attract | Example: Crowded areas always attract pickpockets who try to steal people's wallets.","r":1},{"id":"mwo8fa8ppw1a","q":"سرقة","a":"Robbery | Example: The police got a call about a robbery last night.","r":0},{"id":"mwo8fa8pqpjf","q":"محفظة نقود","a":"Wallet | Example: Police caught a pickpocket who had stolen several wallets and mobile phones at the airport.","r":0},{"id":"mwo8fa8prciv","q":"مجرم","a":"Criminal | Example: They found footprints and fingerprints they think were left by the criminal.","r":0},{"id":"mwo8fa8psve1","q":"جريمة","a":"Crime | Example: They are still investigating the crime.","r":0},{"id":"mwo8fa8pth8c","q":"شاهد عيان","a":"Witness | Example: They spoke to a witness who said she had seen him steal the items.","r":1},{"id":"mwo8fa8pumbf","q":"يحقق","a":"Investigate | Example: The police are still investigating the crime.","r":0},{"id":"mwo8fa8pvu00","q":"يميز","a":"Recognize | Example: The witness was able to recognize the thief from the photos.","r":0},{"id":"mwo8fa8pw65h","q":"يعتقل","a":"Arrest | Example: They think they will arrest someone soon.","r":1},{"id":"mwo8fa8pxdey","q":"المناطق المزدحمة","a":"Crowded areas | Example: Crowded areas attract pickpockets who try to steal people's wallets.","r":1},{"id":"mwo8fa8pyrg3","q":"نشال","a":"Pickpocket | Example: Police caught a pickpocket who had stolen several wallets and mobile phones at the airport.","r":0}]}]}]},{"id":"mwmwg7ec54s5","n":"التربية الإسلامية","e":"🕌","c":"#62d926","ch":[]}];

const ask=(t,f,ok,msg,x)=>{ui.md=Object.assign({t,f,ok,msg},x);render()};
function item(k,id){return arr(k).find(x=>x.id==id)}
document.addEventListener('submit',e=>{e.preventDefault();const m=ui.md,v={};if(m.f)m.f.forEach(f=>v[f.k]=e.target.elements[f.k].value.trim());ui.md=null;m.ok(v);save();render()});
document.addEventListener('input',e=>{if(e.target.name=='t'&&$('#bc'))$('#bc').textContent=parse(e.target.value).length;if(e.target.id=='fs'){S.fs=+e.target.value;$('#fsv').textContent=S.fs;apply();save()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.closest('form')&&!['mc','copy','hl'].includes(t.dataset.a))return;e.stopPropagation();
const a=t.dataset.a,k=t.dataset.k,id=t.dataset.id,v=t.dataset.v,l=nav.l?lec():null;
if(['mode','filt','shuf','reset','addc','editc','wf'].includes(a))ui.tl=0;
const go=()=>{ui.p=0;ui.pg=30;ui.i=0;ui.fl=0;ui.f='all';ui.m='flip'};
if(a=='flip'){ui.fl=ui.fl?0:1;t.classList.toggle('fl');return}
if(a=='open'){if(e.target.closest('.tools'))return;nav[k]=id;go()}
else if(a=='back'){if(nav.l&&ui.p){ui.p=0;ui.fl=0;ui.tl=0}else{const q=nav.l?'l':nav.c?'c':'s';delete nav[q];go()}}
else if(a=='add'){const n=k=='s';ask(n?'مادة جديدة':k=='c'?'فصل جديد':'محاضرة جديدة',[{k:'n',l:'الاسم'}].concat(n?[{k:'e',l:'رمز (إيموجي)',v:'📚'}]:[]),x=>{if(!x.n)return;arr(k).push(n?{id:uid(),n:x.n,e:x.e||'📚',c:PAL[D.subs.length%6],ch:[]}:k=='c'?{id:uid(),n:x.n,lec:[]}:{id:uid(),n:x.n,cards:[]})});return}
else if(a=='ed'){const x=item(k,id);ask('تعديل',[{k:'n',l:'الاسم',v:x.n}].concat(k=='s'?[{k:'e',l:'رمز',v:x.e}]:[]),r=>{if(r.n){x.n=r.n;if(k=='s')x.e=r.e||x.e}});return}
else if(a=='del'){const x=item(k,id);ask('حذف؟',null,()=>{const r=arr(k);r.splice(r.indexOf(x),1)},`سيتم حذف «${esc(x.n)}» وكل ما بداخله.`);return}
else if(a=='mode'){ui.m=v;ui.fl=0}
else if(a=='filt'){ui.f=v;ui.i=0;ui.fl=0}
else if(a=='shuf'){const ids=l.cards.map(c=>c.id);for(let i=ids.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ids[i],ids[j]]=[ids[j],ids[i]]}l.ord=ids;ui.i=0;ui.fl=0;save()}
else if(a=='reset'){delete l.ord;ui.i=0;ui.fl=0;save()}
else if(a=='next'||a=='prev'){const n=deck(l).length;ui.i=(ui.i+(a=='next'?1:-1)+n)%n;ui.fl=0}
else if(a=='rate'){const d=deck(l),c=d[ui.i];c.r=+v;if(v==1)c.w=(c.w||0)+1;else c.g=(c.g||0)+1;if(!(ui.f!='all'&&ui.f!=v))ui.i++;if(ui.i>=deck(l).length){ui.p=0;ui.i=0}ui.fl=0;save()}
else if(a=='start'||a=='startf'){ui.p=1;ui.i=0;ui.fl=0;ui.m='flip';ui.f=a=='start'?'all':v}
else if(a=='wf'){l.ord=ordered(l).slice().sort((x,y)=>sc(y)-sc(x)).map(c=>c.id);ui.i=0;ui.fl=0;save()}
else if(a=='up'||a=='dn'){const ids=ordered(l).map(c=>c.id),i=ids.indexOf(id),j=i+(a=='up'?-1:1);if(j>=0&&j<ids.length){[ids[i],ids[j]]=[ids[j],ids[i]];l.ord=ids;save()}}
else if(a=='hl'){const ta=document.querySelector('#mf [name='+t.dataset.f+']'),x=ta.selectionStart,y=ta.selectionEnd;if(x<y)ta.setRangeText('=='+ta.value.slice(x,y)+'==',x,y,'select');return}
else if(a=='addc'||a=='editc'){const c=a=='editc'?(id?l.cards.find(x=>x.id==id):deck(l)[ui.i]):null;ask(c?'تعديل البطاقة':'بطاقة جديدة',[{k:'q',l:'السؤال',v:c&&c.q,a:1},{k:'a',l:'الجواب',v:c&&c.a,a:1}],x=>{if(!x.q||!x.a)return;if(c){c.q=x.q;c.a=x.a}else{l.cards.push(C(x.q,x.a));if(l.ord)l.ord.push(l.cards[l.cards.length-1].id)}});return}
else if(a=='delc'){const c=l.cards.find(x=>x.id==id);ask('حذف البطاقة؟',null,()=>{l.cards.splice(l.cards.indexOf(c),1);if(l.ord)l.ord=l.ord.filter(i=>i!=c.id)},'لا يمكن التراجع.');return}
else if(a=='more'){ui.pg=(ui.pg||30)+50}
else if(a=='tl')ui.tl=1;
else if(a=='bulk'){ui.tl=0;ask('📋 إضافة بطاقات بالجملة',[{k:'t',l:'الصق النص الطويل هنا',a:1,big:1,h:'<span style="direction:rtl;display:block;text-align:right;line-height:1.9">كل سطر بطاقة: <code>السؤال :: الجواب</code> (أو <code>||</code> أو Tab).<br>للنصوص متعددة الأسطر: <code>س: …</code> ثم <code>ج: …</code> لكل بطاقة.<br>عدد البطاقات المقروءة: <b id="bc">0</b></span>'}],x=>{parse(x.t).forEach(c=>{const n=C(c.q,c.a);l.cards.push(n);if(l.ord)l.ord.push(n.id)})},0,{ok2:'إضافة'});return}
else if(a=='bk'){ask('💾 نسخة احتياطية',[{k:'b',l:'انسخ هذا النص واحفظه في مكان آمن (ملاحظات، رسالة لنفسك…)',a:1,big:1,ro:1,v:JSON.stringify({app:'mudhakarati',v:2,exported:Date.now(),data:{subs:D.subs,S}}),h:''}],()=>{},0,{copy:1,noSave:1});return}
else if(a=='copy'){const ta=document.querySelector('#mf textarea');ta.select();try{document.execCommand('copy')}catch(x){}try{navigator.clipboard.writeText(ta.value)}catch(x){}t.textContent='تم النسخ ✓';return}
else if(a=='rs'){restoreAsk();return}
else if(a=='mine'){ask('📥 تحميل بياناتي؟',null,()=>{D={subs:JSON.parse(JSON.stringify(MINE))};nav={};ui.set=0},'سيتم استبدال البيانات الحالية ببيانات ملفك (6 مواد). خذ نسخة احتياطية قبلها إن كان فيها شي مهم.');return}
else if(a=='zl'){ask('🔄 تصفير هذي المحاضرة؟',null,()=>{zero(l.cards);ui.i=0;ui.fl=0;toast('تم التصفير ✓',1)},`سيرجع حساب الضعيف والقوي لكل بطاقات «${esc(l.n)}» إلى الصفر، كأنك تدرسها لأول مرة. البطاقات نفسها ما تنحذف.`,{ok2:'نعم، صفّر'});return}
else if(a=='zr'){ask('🔄 تصفير كل الحساب؟',null,()=>{D.subs.forEach(s=>s.ch.forEach(c=>c.lec.forEach(l=>zero(l.cards))));ui.set=0;ui.i=0;ui.fl=0;ui.f='all';toast('تم تصفير الحساب ✓',1)},'سيرجع حساب الضعيف والقوي لكل البطاقات بكل المواد إلى الصفر، كأنك تدرس لأول مرة. المواد والبطاقات ما تنحذف. يُفضّل تأخذ نسخة احتياطية قبلها.',{ok2:'نعم، صفّر الكل'});return}
else if(a=='rz'){ask('🗑 تصفير التطبيق؟',null,()=>{D={subs:[]};S=Object.assign({},DEF,{theme:th0()});nav={};ui.set=0},'سيتم حذف كل المواد والبطاقات والإعدادات نهائياً.');return}
else if(a=='set')ui.set=1;
else if(a=='close'){if(t.classList.contains('ov')&&e.target!==t)return;ui.set=0;ui.tl=0}
else if(a=='mc')ui.md=null;
else if(a=='sv'){S[k]=k=='hlOn'?+v:k=='fs'?+v:v;save()}
render()});
document.addEventListener('keydown',e=>{if(!nav.l||!ui.p||ui.md||ui.set||/INPUT|TEXTAREA/.test(e.target.tagName))return;
const b=k=>document.querySelector('[data-a='+k+']');
if(e.key=='ArrowLeft')b('next')?.click();else if(e.key=='ArrowRight')b('prev')?.click();else if(e.key==' '){e.preventDefault();b('flip')?.click()}});
apply();$('#app').innerHTML='<div class="empty">جارٍ التحميل…</div>';boot();
</script>
<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
</body>
